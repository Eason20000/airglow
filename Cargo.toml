[workspace]
resolver = "2"
members = [
  "crates/airglow-common",
  "crates/airglow-hostd",
  "crates/airglow-session",
  "crates/airglow-capture",
  "crates/airglowctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Eason20000/airglow"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"

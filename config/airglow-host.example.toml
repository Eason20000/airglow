# airglow host daemon configuration. NixOS generates this file
# declaratively; do not edit in place.
#
# Port note: Sunshine owns 47984-48010 (web UI/video/audio/control); pick
# the control channel outside that range.

listen = "0.0.0.0:48990"
host_id = "z390"

[session]
user_allowlist = ["eason20000"]
# "sway" (v1, wlroots headless) or "gnome" (v1.5+, gnome-shell
# --headless --virtual-monitor).
profile = "sway"
sway_binary = "sway"
gnome_session_command = "gnome-shell"

[sunshine]
binary = "sunshine"
encoder = "vaapi"
stream_port = 47989
